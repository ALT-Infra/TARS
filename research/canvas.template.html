<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Explore the problems drone autonomy projects solve and the independently published work assembled beneath them."
    />
    <title>Drone autonomy atlas</title>
    <style>
      /*__FONTS__*/
      /*__CSS__*/
    </style>
  </head>
  <body>
    <a href="#canvas" class="skip">Skip to canvas</a>
    <header class="topbar">
      <a class="brand" href="#assembled" aria-label="Drone autonomy atlas"
        ><svg viewBox="0 0 40 40" aria-hidden="true" fill="none">
          <path
            d="M10 10 30 30M30 10 10 30"
            stroke="#245bd7"
            stroke-width="2"
          />
          <g stroke="#16354b" stroke-width="1.5">
            <circle cx="9" cy="9" r="6" />
            <circle cx="31" cy="9" r="6" />
            <circle cx="9" cy="31" r="6" />
            <circle cx="31" cy="31" r="6" />
          </g></svg
        ><span>Drone autonomy atlas</span></a
      >
      <div class="mode-switch" role="group" aria-label="Atlas views">
        <button data-mode="assembled" aria-pressed="true">
          Assembled systems</button
        ><button data-mode="focused" aria-pressed="false">
          Focused components</button
        ><button
          data-action="direction"
          id="direction-button"
          aria-pressed="false"
        >
          Project direction
        </button>
      </div>
      <div class="top-tools">
        <button class="search-trigger" data-action="search">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="10" cy="10" r="6" />
            <path d="m15 15 6 6" /></svg
          ><span>Find a project</span><kbd>/</kbd></button
        ><button
          class="icon-button"
          data-action="references"
          aria-label="Reference tools"
          aria-expanded="false"
        >
          •••
        </button>
      </div>
    </header>
    <main id="workspace">
      <div
        id="canvas"
        tabindex="0"
        role="region"
        aria-label="Interactive project canvas. Drag to pan; scroll or use buttons to zoom. Press slash to find a project."
      >
        <div id="world">
          <svg
            id="wires"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Documented project relationships"
          ></svg>
          <div id="frames"></div>
          <div id="nodes"></div>
        </div>
      </div>
      <div class="canvas-caption" id="caption"></div>
      <aside
        class="index floating"
        id="index"
        aria-label="Explore by problem"
      ></aside>
      <button
        class="index-reopen floating"
        id="index-reopen"
        data-action="index"
        hidden
      >
        Explore problems
      </button>
      <aside
        id="inspector"
        class="inspector floating"
        aria-label="Selected project"
        hidden
      ></aside>
      <div id="references" class="reference-menu floating" hidden>
        <strong>Research, on demand</strong
        ><button data-action="audit">
          Conversation audit <span>36 checks</span></button
        ><button data-action="method">Evidence & methodology</button
        ><button data-action="library">All project records</button
        ><button data-action="download">Download the research data</button
        ><button data-action="help">How to explore</button>
      </div>
      <div class="bottom-left">
        <div class="breadcrumbs floating" id="breadcrumbs"></div>
        <button
          class="legend-trigger floating"
          data-action="legend"
          aria-expanded="false"
        >
          <span class="line-sample uses"></span>Connection types
        </button>
      </div>
      <section
        id="legend"
        class="legend floating"
        aria-label="Relationship filters"
        hidden
      ></section>
      <div class="navigation floating" aria-label="Canvas navigation">
        <button
          data-action="back"
          aria-label="Back to previous exploration"
          id="back-button"
        >
          ↶</button
        ><span class="control-divider"></span
        ><button data-action="zoom-out" aria-label="Zoom out">−</button
        ><button
          data-action="zoom-reset"
          id="zoom-label"
          title="Return to readable size"
        >
          100%</button
        ><button data-action="zoom-in" aria-label="Zoom in">+</button
        ><span class="control-divider"></span
        ><button
          data-action="fit"
          aria-label="Fit the current assembly or problem group"
        >
          Fit</button
        ><button data-action="overview" aria-label="Show the whole landscape">
          Overview
        </button>
      </div>
      <button
        class="compare-launch floating"
        id="compare-launch"
        data-action="compare"
      >
        Compare <span id="compare-count">0</span>
      </button>
      <div class="pan-hint" id="pan-hint">Drag to explore · Scroll to zoom</div>
    </main>
    <!--__DIRECTION__-->
    <dialog id="sheet" aria-labelledby="sheet-title">
      <header>
        <div>
          <h2 id="sheet-title"></h2>
          <p id="sheet-subtitle"></p>
        </div>
        <button class="icon-button close-dialog" aria-label="Close panel">
          ×
        </button>
      </header>
      <div id="sheet-content"></div>
    </dialog>
    <dialog id="finder" aria-labelledby="finder-title">
      <div class="finder-head">
        <h2 id="finder-title" class="sr-only">Find a project</h2>
        <input
          id="finder-input"
          type="search"
          placeholder="A project, a problem, a sensor…"
          aria-label="Search every project"
          autocomplete="off"
        /><button class="icon-button close-finder" aria-label="Close search">
          ×
        </button>
      </div>
      <div id="finder-results"></div>
      <footer>
        Use ↑ ↓ to choose, Enter to explore. All project records are searchable.
      </footer>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript
      ><div class="no-script">
        <h1>This atlas uses JavaScript for exploration.</h1>
        <p>
          Enable JavaScript to use the canvas, or read the accompanying
          dataset.json for the complete research records and sources.
        </p>
      </div></noscript
    >
    <script id="atlas-data" type="application/json">
      __DATA__
    </script>
    <script>
      /*__JS__*/
    </script>
  </body>
</html>
